services:
  postgres:
    image: postgres:16-alpine
    container_name: kitobxon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitobxon_ai}
      POSTGRES_USER: ${POSTGRES_USER:-kitobxon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitobxon_secure_password_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitobxon_user} -d ${POSTGRES_DB:-kitobxon_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kitobxon_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitobxon_admin
    restart: unless-stopped
    command: ["python", "-m", "app.admin_main"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kitobxon_user}:${POSTGRES_PASSWORD:-kitobxon_secure_password_2026}@postgres:5432/${POSTGRES_DB:-kitobxon_ai}
      REDIS_URL: redis://redis:6379/0
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitobxon_bot
    restart: unless-stopped
    command: ["python", "-m", "app.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kitobxon_user}:${POSTGRES_PASSWORD:-kitobxon_secure_password_2026}@postgres:5432/${POSTGRES_DB:-kitobxon_ai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
