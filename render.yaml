services:
  # 1. Admin Web Panel
  - type: web
    name: kitobxon-admin
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -U pip && pip install .
    startCommand: python -m app.admin_main
    healthCheckPath: /admin/api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: kitobxon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kitobxon-redis
          property: connectionString
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_HOST
        value: "0.0.0.0"
      - key: ADMIN_PORT
        value: "8000"

  # 2. Telegram Bot Background Worker
  - type: worker
    name: kitobxon-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -U pip && pip install .
    startCommand: python -m app.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kitobxon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kitobxon-redis
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false

databases:
  - name: kitobxon-postgres
    region: frankfurt
    plan: free
    databaseName: kitobxon_ai
    user: kitobxon_user
